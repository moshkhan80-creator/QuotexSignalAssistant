<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quotex Signal Assistant</title>
</head>

<body>
  <h1>Quotex Signal Assistant</h1>
  <p>1 Minute Signal Assistant</p>

  <button onclick="showSignal()">GET SIGNAL</button>

  <h2 id="signal">Waiting...</h2>

  <script>
    function showSignal() {
      document.getElementById("signal").innerText =
        "Signal system ready";
    }
  </script>
</body>
</html>
